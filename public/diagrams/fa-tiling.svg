<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Noto Sans SC',sans-serif">
  <style>
    .card{fill:#ffffff}
    .t{fill:#0f172a}
    .m{fill:#64748b}
    .cell{fill:#f8fafc;stroke:#e2e8f0}
    .panel{fill:#f8fafc;stroke:#e2e8f0}
    .code{fill:#334155}
    .arrow{fill:#94a3b8}
    .aline{stroke:#94a3b8;stroke-width:1.6}
    @media (prefers-color-scheme:dark){
      .card{fill:#0b1120}
      .t{fill:#e5e9f0}
      .m{fill:#93a1b8}
      .cell{fill:#0f1830;stroke:#243149}
      .panel{fill:#0f1830;stroke:#243149}
      .code{fill:#b7c2d6}
    }
  </style>
  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path class="arrow" d="M0,0 L8,4 L0,8 Z"/>
    </marker>
  </defs>
  <rect class="card" width="760" height="410"/>

  <text x="30" y="36" class="t" font-size="18" font-weight="700">分块计算 + 在线 softmax</text>
  <text x="30" y="58" class="m" font-size="13">softmax 需要全局最大值，而分块是增量的 —— 用运行统计量边算边校正</text>

  <!-- attention matrix grid -->
  <text x="150" y="96" class="m" font-size="12.5" text-anchor="middle">注意力矩阵（按块切分）</text>
  <text x="82" y="118" class="m" font-size="12" text-anchor="middle">K₁</text>
  <text x="126" y="118" class="m" font-size="12" text-anchor="middle">K₂</text>
  <text x="170" y="118" class="m" font-size="12" text-anchor="middle">K₃</text>
  <text x="214" y="118" class="m" font-size="12" text-anchor="middle">K₄</text>
  <!-- rows -->
  <g>
    <text x="52" y="150" class="m" font-size="12" text-anchor="end">Q₁</text>
    <text x="52" y="194" class="m" font-size="12" text-anchor="end">Q₂</text>
    <text x="52" y="238" class="m" font-size="12" text-anchor="end">Q₃</text>
    <text x="52" y="282" class="m" font-size="12" text-anchor="end">Q₄</text>
  </g>
  <!-- 4x4 cells, top-left 60,128, cell 44, gap 0 (2px stroke visual) -->
  <g>
    <rect class="cell" x="60" y="128" width="42" height="42"/>
    <rect class="cell" x="104" y="128" width="42" height="42"/>
    <rect class="cell" x="148" y="128" width="42" height="42"/>
    <rect class="cell" x="192" y="128" width="42" height="42"/>
    <rect class="cell" x="60" y="172" width="42" height="42"/>
    <rect class="cell" x="104" y="172" width="42" height="42"/>
    <rect x="148" y="172" width="42" height="42" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-width="1.6"/>
    <rect class="cell" x="192" y="172" width="42" height="42"/>
    <rect class="cell" x="60" y="216" width="42" height="42"/>
    <rect class="cell" x="104" y="216" width="42" height="42"/>
    <rect class="cell" x="148" y="216" width="42" height="42"/>
    <rect class="cell" x="192" y="216" width="42" height="42"/>
    <rect class="cell" x="60" y="260" width="42" height="42"/>
    <rect class="cell" x="104" y="260" width="42" height="42"/>
    <rect class="cell" x="148" y="260" width="42" height="42"/>
    <rect class="cell" x="192" y="260" width="42" height="42"/>
  </g>
  <text x="169" y="197" class="t" font-size="11" text-anchor="middle" font-weight="700">Sᵢⱼ</text>
  <!-- inner loop arrow along row Q2 -->
  <line class="aline" x1="60" y1="322" x2="234" y2="322" marker-end="url(#ah2)"/>
  <text x="147" y="342" class="m" font-size="12" text-anchor="middle">固定 Qᵢ，遍历 K,V 块（块驻留 SRAM）</text>

  <!-- state update panel -->
  <rect class="panel" x="300" y="88" width="430" height="234" rx="10"/>
  <text x="320" y="112" class="t" font-size="13.5" font-weight="600">每处理一个 K,V 块，更新运行状态</text>
  <!-- state chips -->
  <rect x="320" y="124" width="118" height="26" rx="6" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1"/>
  <text x="379" y="141" class="t" font-size="12" text-anchor="middle">m 运行最大值</text>
  <rect x="446" y="124" width="104" height="26" rx="6" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1"/>
  <text x="498" y="141" class="t" font-size="12" text-anchor="middle">l 指数和</text>
  <rect x="558" y="124" width="152" height="26" rx="6" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1"/>
  <text x="634" y="141" class="t" font-size="12" text-anchor="middle">O 输出累加器</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="320" y="176" class="code">Sᵢⱼ = Qᵢ · Kⱼᵀ</text>
    <text x="320" y="200" class="code">m′  = max(m, rowmax(Sᵢⱼ))</text>
    <text x="320" y="224" class="code">P̃   = exp(Sᵢⱼ − m′)</text>
    <text x="320" y="248" class="code">l   ← e^(m−m′)·l + rowsum(P̃)</text>
    <text x="320" y="272" class="code">O   ← e^(m−m′)·O + P̃·Vⱼ</text>
    <text x="320" y="296" class="code">m   ← m′</text>
  </g>
  <line x1="300" y1="322" x2="730" y2="322" stroke="#94a3b8" stroke-opacity="0.4" stroke-dasharray="4 4"/>

  <text x="30" y="378" class="t" font-size="12.5"><tspan font-weight="600">收尾</tspan><tspan class="code" font-family="ui-monospace,Menlo,Consolas,monospace"> Oᵢ ← O / l</tspan><tspan class="m">。新块带来更大最大值时，用 e^(m−m′) 把已累加的 O、l 重新缩放，</tspan></text>
  <text x="30" y="396" class="m" font-size="12.5">保证结果与一次性对整行做 softmax 完全等价。</text>
</svg>
